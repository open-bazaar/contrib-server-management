[project]
name = "bazaar-contrib-server-management"
version = "0.3.0rc1"
description = "The server's default configuration, its composition and the import of 0.2's ~/.bcs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "bazaar-core~=0.3.0rc1",
    "bazaar-contrib-config~=0.3.0rc1",
    "bazaar-contrib-http~=0.3.0rc1",
    "bazaar-contrib-schema~=0.3.0rc1",
    "bazaar-contrib-server-migrations~=0.3.0rc1",
    "bazaar-contrib-storage~=0.3.0rc1",
    "pydantic>=2.12.0",
]

[project.entry-points."bazaar_compute_node.contribs"]
server-management = "bazaar_contrib_server_management:server_management"

[project.entry-points."bazaar_compute_node.defaults"]
server = "bazaar_contrib_server_management:defaults"

[project.urls]
Repository = "https://github.com/open-bazaar/contrib-server-management"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.15"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMatchNotExhaustive = "error"
reportUnreachable = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"

[tool.ruff.lint]
extend-select = ["ASYNC"]

[dependency-groups]
dev = [
    "bazaar-compute~=0.3.0rc17",
    "blockbuster>=1.5.29,<1.6",
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]
