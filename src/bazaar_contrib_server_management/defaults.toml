version = "5"
contrib_indexes = [
    "resource://bazaar_contrib_manager/catalog.json",
    "resource://bazaar_contrib_manager/open_bazaar_index.json",
    "https://raw.githubusercontent.com/open-bazaar/contrib-index/main/index.json",
]

[[contribs]]
package = "bazaar-contrib-config-filesystem~=0.3.0rc1"
enabled = []

[[contribs]]
package = "bazaar-contrib-invoke~=0.3.0rc1"
[[contribs.enabled]]
entry = "commands"

[[contribs]]
package = "bazaar-contrib-manager~=0.3.0rc1"
[[contribs.enabled]]
entry = "contrib-manager"
[[contribs.enabled]]
entry = "contrib-indexes"

[[contribs]]
package = "bazaar-contrib-logging~=0.3.0rc1"
[[contribs.enabled]]
entry = "logging"

[[contribs]]
package = "bazaar-contrib-timer~=0.3.0rc1"
[[contribs.enabled]]
entry = "timer-wheel"

[[contribs]]
package = "bazaar-contrib-storage~=0.3.0rc1"
enabled = []

[[contribs]]
package = "bazaar-contrib-sqlite~=0.3.0rc1"
enabled = []

[[contribs]]
package = "bazaar-contrib-schema~=0.3.0rc1"
enabled = []

[[contribs]]
package = "bazaar-contrib-http~=0.3.0rc1"
[[contribs.enabled]]
entry = "http"
[contribs.enabled.config]
listen = "127.0.0.1:8765"

[[contribs]]
package = "bazaar-contrib-server-database~=0.3.0rc1"
[[contribs.enabled]]
entry = "server-database"
[contribs.enabled.config]
storage = "sqlite"

[[contribs]]
package = "bazaar-contrib-server-migrations~=0.3.0rc1"
[[contribs.enabled]]
entry = "server-migrations"

[[contribs]]
package = "bazaar-contrib-server~=0.3.0rc3"
[[contribs.enabled]]
entry = "server"
[[contribs.enabled]]
entry = "server-theme-night"
[[contribs.enabled]]
entry = "server-theme-day"

[[contribs]]
package = "bazaar-contrib-server-overview~=0.3.0rc2"
[[contribs.enabled]]
entry = "server-overview"

[[contribs]]
package = "bazaar-contrib-server-access~=0.3.0rc4"
[[contribs.enabled]]
entry = "server-access"
[contribs.enabled.config]
session_minutes = 10

[[contribs]]
package = "bazaar-contrib-server-computer~=0.3.0rc1"
[[contribs.enabled]]
entry = "server-relay-memory"
[[contribs.enabled]]
entry = "server-computer"

[[contribs]]
package = "bazaar-contrib-server-agent~=0.3.0rc1"
[[contribs.enabled]]
entry = "server-agent"

[[contribs]]
package = "bazaar-contrib-server-activity~=0.3.0rc2"
[[contribs.enabled]]
entry = "server-activity"
[contribs.enabled.config]
retention_days = 30

[[contribs]]
package = "bazaar-contrib-server-conversation~=0.3.0rc1"
[[contribs.enabled]]
entry = "server-conversation"

[[contribs]]
package = "bazaar-contrib-server-usage~=0.3.0rc1"
[[contribs.enabled]]
entry = "server-usage"

[[contribs]]
package = "bazaar-contrib-server-management~=0.3.0rc1"
enabled = []
